<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email confirmé — Nikkitango</title>
  <style>
    body {
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      background-color: #FAEEDA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .icon {
      width: 72px; height: 72px;
      background: #EAF3DE;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    h1 { color: #173404; font-size: 20px; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; line-height: 1.6; }
    .btn {
      display: inline-block;
      background: #3B6D11;
      color: white;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Email confirmé</h1>
    <p>Ton compte Nikkitango est activé. Tu peux maintenant ouvrir l'application et te connecter.</p>
    <a class="btn" id="openApp" href="nikkitango://login">Ouvrir Nikkitango</a>
    <p style="margin-top: 20px; font-size: 12px;">L'app ne s'ouvre pas ? Reviens-y simplement et connecte-toi.</p>
  </div>
  <script>
    // Tente d'ouvrir l'app via un lien personnalisé (deep link), sans bloquer si elle n'est pas installée
    window.location.href = "nikkitango://login";
  </script>
</body>
</html>
